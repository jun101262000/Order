<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>葳葳海鮮 - 雲端訂購系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        /* 鎖定基準字體大小，防止系統字體放大破壞版面 */
        html { font-size: 16px !important; }
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            line-height: 1.4;
            -webkit-text-size-adjust: 100%;
            padding-bottom: 240px;
        }
        .order-table th { padding: 12px 8px; border-bottom: 3px solid #000; color: #000; }
        .order-table td { padding: 16px 8px; border-bottom: 1px solid #cbd5e1; color: #000; }
        
        input:focus { border-color: #0369a1 !important; outline: none; }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 16px;
        }

        .drawer-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .footer-input {
            background-color: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }
        .footer-input:focus {
            background-color: rgba(255,255,255,0.2);
            border-color: white;
        }
        .footer-input::placeholder { color: rgba(255,255,255,0.4); }

        #thermal-receipt {
            position: absolute; left: -9999px; top: 0; width: 800px; min-height: 1200px;
            background: #ffffff; color: #000000; padding: 40px; box-sizing: border-box;
            font-family: 'Noto Sans TC', sans-serif; border: 4px solid #000000;
            -webkit-font-smoothing: none; text-rendering: optimizeSpeed;
        }
        .thermal-header { text-align: center; border-bottom: 6px solid #000; padding-bottom: 20px; margin-bottom: 20px; }
        .thermal-title { font-size: 64px; font-weight: 900; line-height: 1; color: #000; }
        .thermal-meta { font-size: 26px; margin-top: 10px; font-weight: 900; color: #000; }
        .thermal-info { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 4px solid #000; padding-bottom: 20px; }
        .thermal-customer { font-size: 46px; font-weight: 900; color: #000; word-break: break-all; }
        .thermal-phone { font-size: 34px; font-weight: 900; color: #000; margin-top: 5px; }
        .thermal-address { font-size: 30px; font-weight: 900; color: #000; margin-top: 10px; line-height: 1.3; }
        .thermal-status { font-size: 32px; font-weight: 900; border: 4px solid #000; padding: 5px 15px; border-radius: 10px; display: inline-block; margin-top: 10px; color: #000; }
        .thermal-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .thermal-table th { border-bottom: 4px solid #000; text-align: left; font-size: 30px; padding: 10px 0; color: #000; font-weight: 900; }
        .thermal-table td { border-bottom: 2px dashed #000; font-size: 48px; padding: 15px 0; font-weight: 400; color: #000; } 
        .thermal-footer { border-top: 6px solid #000; padding-top: 20px; }
        .thermal-total-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
        .thermal-total-label { font-size: 34px; font-weight: 900; color: #000; }
        .thermal-total-amount { font-size: 80px; font-weight: 900; line-height: 1; color: #000; }
        .thermal-contact { text-align: left; margin-top: 30px; color: #000; border-top: 4px solid #000; padding-top: 20px; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; padding-bottom: 0; }
            .print-container { width: 100%; border: none; box-shadow: none; }
            tr.even-row { background-color: #f1f5f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root">
        <!-- 如果 React 沒載入，會顯示這個 -->
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #475569; background-color: #f8fafc;">
            <svg style="animation: spin 1s linear infinite; width: 50px; height: 50px; margin-bottom: 20px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" stroke-opacity="0.25"></circle>
                <path fill="#0284c7" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">系統初始化中...</h2>
            <p>如果此畫面停留超過 5 秒，請重新整理網頁</p>
        </div>
    </div>

    <!-- 確保 babel 在本地環境中編譯 JSX -->
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // ==========================================
        // 您的專屬 Google Apps Script 網址
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwe4dEAFMD-3lkgQUl3PXfu_sJb419LqS04bJnz5CRB_fa-QRQU6eyrJmIjf4d7nuYa/exec";
        // ==========================================

        const Icons = {
            Anchor: () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8 md:w-10 md:h-10"><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/><circle cx="12" cy="5" r="3"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Camera: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6 md:w-7 md:h-7"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>,
            Printer: () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>,
            Close: () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            History: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>,
            Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>,
            List: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>,
            ChevronLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
            Alert: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><polyline points="20 6 9 17 4 12"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            CreditCard: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/><line x1="10" x2="10" y1="15" y2="15"/></svg>,
            Package: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            CloudOff: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m2 2 20 20"/><path d="M5.78 5.78a7 7 0 0 0 9.24 9.24"/><path d="M8.2 8.2c-.32.06-.65.1-.98.15-2.77.45-4.8 2.8-4.8 5.65 0 3.1 2.5 5.6 5.6 5.6h10.4"/><path d="M17.4 17.4A7 7 0 0 0 22 11.5c0-3.6-2.9-6.5-6.5-6.5a6.5 6.5 0 0 0-4.6 1.8"/></svg>
        };

        const DEFAULT_PRODUCTS = [
            { id: 1, name: '整尾無刺虱目魚', unit: '尾', defPrice: 220, range: '170~220', canEdit: true, defJinPrice: 190 },
            { id: 2, name: '去頭尾半尾魚', unit: '片', defPrice: 170, range: '110~170', canEdit: true, defJinPrice: 240 },
            { id: 3, name: '透抽', unit: '尾', defPrice: 330, range: '180~330', canEdit: true, note: '依重量', defJinPrice: 330 },
            { id: 4, name: '魚肚', unit: '片(200~240g)', defPrice: 130, canEdit: true },
            { id: 5, name: '魚柳', unit: '包(半斤)', defPrice: 70, canEdit: true },
            { id: 6, name: '魚嶺(已調味)', unit: '包(半斤)', defPrice: 110, canEdit: true },
            { id: 7, name: '魚皮', unit: '包(半斤)', defPrice: 70, canEdit: true },
            { id: 8, name: '生蝦', unit: '包(500g)', defPrice: 270, canEdit: true },
            { id: 9, name: '熟蝦(退冰即可食)', unit: '包(500g)', defPrice: 270, canEdit: true },
            { id: 10, name: '蝦仁', unit: '包(150g)', defPrice: 120, canEdit: true },
            { id: 11, name: '挪威鯖魚(微刺)', unit: '片', defPrice: 80, canEdit: true },
            { id: 12, name: '吳郭魚(台灣鯛)', unit: '大尾', defPrice: 100, range: '80~100', canEdit: true },
            { id: 13, name: '學甲虱目魚丸(真空包)', unit: '包(1斤)', defPrice: 120, canEdit: true, defJinPrice: 120 },
            { id: 14, name: '花枝丸', unit: '包(1斤)', defPrice: 300, canEdit: true, defJinPrice: 300 },
            { id: 15, name: '花枝月亮蝦餅', unit: '包', defPrice: 360, canEdit: true },
            { id: 16, name: '花枝蝦排', unit: '包', defPrice: 360, canEdit: true },
        ];

        // 核心連線引擎：與 GAS 溝通
        const fetchGas = async (action, payload = null) => {
            if (!GAS_URL || GAS_URL.includes("您的_GAS_網址")) {
                throw new Error("尚未設定 Google Apps Script 網址，請先修改程式碼。");
            }
            if (action === 'init') {
                const res = await fetch(GAS_URL);
                if (!res.ok) throw new Error("網路連線異常");
                return await res.json();
            } else {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action, payload })
                });
                if (!res.ok) throw new Error("網路連線異常");
                return await res.json();
            }
        }

        // 用一個包裝器來攔截未處理的錯誤，防止畫面變白
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, errorInfo: error };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ padding: '20px', textAlign: 'center', fontFamily: 'sans-serif' }}>
                            <h2 style={{ color: 'red' }}>糟糕，發生了一些錯誤</h2>
                            <p>{this.state.errorInfo?.toString()}</p>
                            <button onClick={() => window.location.reload()} style={{ padding: '10px 20px', marginTop: '20px' }}>重新整理</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function MainApp() {
            const [dbReady, setDbReady] = useState(false);
            const [isLocalMode, setIsLocalMode] = useState(false);
            const [initError, setInitError] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false); 

            const [showPriceModal, setShowPriceModal] = useState(false);
            const [showChangelog, setShowChangelog] = useState(false);
            const [showInventoryPanel, setShowInventoryPanel] = useState(false);
            const [sysMsg, setSysMsg] = useState(null);

            const [inventory, setInventory] = useState([]);
            const [history, setHistory] = useState([]);

            const [orderer, setOrderer] = useState({ name: '', phone: '', address: '', isHandwritten: false });
            const [paymentStatus, setPaymentStatus] = useState('pending');
            const [creditAmount, setCreditAmount] = useState('');
            
            const [stdQtys, setStdQtys] = useState({});
            const [stdPrices, setStdPrices] = useState({});
            const [jinPrices, setJinPrices] = useState({});
            const [extraStdItems, setExtraStdItems] = useState({});
            
            const [limitedItems, setLimitedItems] = useState([]);
            const [newLimited, setNewLimited] = useState({ name: '', price: '', qty: '' });
            const [sharingItems, setSharingItems] = useState([]);
            const [newSharing, setNewSharing] = useState({ name: '', qty: '' });
            
            const [ship, setShip] = useState({ type: 'free', fee: '' });
            const [discount, setDiscount] = useState('');
            
            const [showBill, setShowBill] = useState(false);
            const [screenshotUrl, setScreenshotUrl] = useState(null);
            const [showDetailDrawer, setShowDetailDrawer] = useState(false);
            const [currentOrderId, setCurrentOrderId] = useState(null);
            const [confirmAction, setConfirmAction] = useState(null); 

            const loadDataFromGAS = async () => {
                try {
                    setInitError(null);
                    const res = await fetchGas('init');
                    
                    if(res && res.error) {
                        throw new Error(res.error);
                    }

                    // 處理庫存與報價
                    let items = res.inventory || [];
                    if (items.length === 0) {
                        items = DEFAULT_PRODUCTS.map(p => ({...p, stock: 0}));
                        // 如果雲端沒資料，嘗試建立初始資料
                        await fetchGas('saveInventory', items);
                    }
                    items.sort((a,b) => a.id - b.id);
                    setInventory(items);
                    
                    const newStd = {}; const newJin = {};
                    items.forEach(item => {
                        newStd[item.id] = item.defPrice !== undefined ? item.defPrice : 0;
                        if(item.defJinPrice !== undefined) newJin[item.id] = item.defJinPrice;
                    });
                    setStdPrices(newStd);
                    setJinPrices(newJin);

                    // 處理歷史紀錄
                    let ords = res.orders || [];
                    ords.sort((a,b) => b.timestampMs - a.timestampMs); 
                    setHistory(ords);

                    setDbReady(true);
                    if(!window.hasShownPriceModal) {
                        setShowPriceModal(true);
                        window.hasShownPriceModal = true;
                    }
                } catch (error) {
                    console.error("GAS 連線失敗", error);
                    setInitError(error.message || "連線失敗，請檢查網址或網路狀態。");
                }
            };

            // 初始載入
            useEffect(() => {
                if (!dbReady && !isLocalMode) {
                    loadDataFromGAS();
                }
            }, [dbReady, isLocalMode]);

            const startLocalMode = () => {
                setIsLocalMode(true);
                setDbReady(true);
                setInventory(DEFAULT_PRODUCTS.map(p => ({...p, stock: 0})));
                
                const newStd = {}; const newJin = {};
                DEFAULT_PRODUCTS.forEach(item => {
                    newStd[item.id] = item.defPrice;
                    if(item.defJinPrice) newJin[item.id] = item.defJinPrice;
                });
                setStdPrices(newStd);
                setJinPrices(newJin);

                const saved = localStorage.getItem('weiwei_history_v2');
                if (saved) { try { setHistory(JSON.parse(saved)); } catch(e) {} }

                setInitError(null);
                setShowPriceModal(true); 
            };

            if (!dbReady && !isLocalMode) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-100 p-4">
                        {!initError ? (
                            <div className="flex flex-col items-center">
                                <svg className="animate-spin w-12 h-12 text-sky-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" strokeOpacity="0.25"></circle>
                                    <path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                <h2 className="text-xl font-bold text-slate-700 mb-2">Google 試算表連線中...</h2>
                                <p className="text-sm text-slate-500 mb-6">正在同步表單資料庫，請稍候</p>
                                <button onClick={startLocalMode} className="mt-8 px-6 py-2 rounded-full border-2 border-slate-300 text-slate-500 font-bold hover:bg-slate-200 transition-colors">
                                    略過連線，直接使用單機版
                                </button>
                            </div>
                        ) : (
                            <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-2xl max-w-[90%] md:max-w-md w-full text-center flex flex-col items-center animate-in zoom-in-95 duration-300">
                                <div className="text-amber-500 mb-4 bg-amber-50 p-4 rounded-full">
                                    <Icons.CloudOff />
                                </div>
                                <h2 className="text-2xl font-black text-slate-800 mb-3">無法連線至雲端</h2>
                                <p className="text-slate-600 font-bold mb-6 text-sm whitespace-pre-line break-words">
                                    {initError}
                                    {"\n\n如果錯誤持續發生，請確認您的 GAS_URL 是否正確，或暫時切換到單機模式。"}
                                </p>
                                <button onClick={startLocalMode} className="w-full py-3 md:py-4 rounded-xl font-black text-lg md:text-xl bg-slate-800 text-white shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2 mb-3">
                                    強制進入單機測試模式
                                </button>
                                <button onClick={() => {setInitError(null); loadDataFromGAS();}} className="w-full py-3 md:py-4 rounded-xl font-bold text-lg text-slate-600 bg-slate-100 hover:bg-slate-200 active:scale-95 transition-transform flex items-center justify-center gap-2">
                                    <Icons.RefreshCw /> 重新嘗試連線
                                </button>
                            </div>
                        )}
                    </div>
                );
            }

            const clearAllState = () => {
                setOrderer({ name: '', phone: '', address: '', isHandwritten: false });
                setPaymentStatus('pending'); setCreditAmount('');
                setStdQtys({}); setExtraStdItems({}); 
                setLimitedItems([]); setSharingItems([]);
                setShip({ type: 'free', fee: '' }); setDiscount('');
                setNewLimited({ name: '', price: '', qty: '' }); setNewSharing({ name: '', qty: '' });
                setCurrentOrderId(null); setShowBill(false); setScreenshotUrl(null);
                window.scrollTo(0, 0); setConfirmAction(null);
            };

            const loadFromHistory = (record) => {
                const d = record;
                setOrderer(d.orderer || { name: '', phone: '', address: '', isHandwritten: false });
                setPaymentStatus(d.paymentStatus || 'pending'); setCreditAmount(d.creditAmount || '');
                setStdQtys(d.stdQtys || {}); 
                setExtraStdItems(d.extraStdItems || {});
                setLimitedItems(d.limitedItems || []); setSharingItems(d.sharingItems || []);
                setShip(d.ship || { type: 'free', fee: '' }); setDiscount(d.discount || '');
                setCurrentOrderId(d.dbId); setShowHistory(false); setShowBill(false); 
                window.scrollTo(0,0);
            };

            const handleAddExtra = (pid) => {
                setExtraStdItems(prev => {
                    const current = prev[pid] || [];
                    return { ...prev, [pid]: [...current, { id: Date.now(), price: '', qty: '' }] };
                });
            };
            const updateExtra = (pid, extId, field, value) => {
                setExtraStdItems(prev => {
                    const current = prev[pid] || [];
                    return { ...prev, [pid]: current.map(item => item.id === extId ? { ...item, [field]: value } : item) };
                });
            };
            const removeExtra = (pid, extId) => {
                setExtraStdItems(prev => {
                    const current = prev[pid] || [];
                    return { ...prev, [pid]: current.filter(item => item.id !== extId) };
                });
            };

            // 儲存報價到 Google Sheets
            const savePricesToDb = async () => {
                if (isLocalMode) {
                    setShowPriceModal(false);
                    return;
                }
                setIsSyncing(true);
                try {
                    const newInventory = inventory.map(p => ({
                        ...p,
                        defPrice: stdPrices[p.id] !== undefined ? stdPrices[p.id] : p.defPrice,
                        defJinPrice: jinPrices[p.id] !== undefined ? jinPrices[p.id] : p.defJinPrice
                    }));
                    await fetchGas("saveInventory", newInventory);
                    setInventory(newInventory); 
                    setShowPriceModal(false);
                } catch(e) {
                    setSysMsg({ type: 'error', title: '儲存失敗', text: '無法儲存報價至雲端，請檢查網路連線。' });
                } finally {
                    setIsSyncing(false);
                }
            };

            // 庫存更新到 Google Sheets (整批覆寫)
            const handleFinishInventory = async () => {
                if (isLocalMode) {
                    setShowInventoryPanel(false);
                    return;
                }
                setIsSyncing(true);
                try {
                    await fetchGas("saveInventory", inventory);
                    setShowInventoryPanel(false);
                } catch(e) {
                    setSysMsg({ type: 'error', title: '儲存失敗', text: '無法更新庫存至雲端，請檢查網路連線。' });
                } finally {
                    setIsSyncing(false);
                }
            };

            const updateStockLocal = (pid, newStock) => {
                setInventory(prev => prev.map(p => p.id === pid ? { ...p, stock: parseInt(newStock) || 0 } : p));
            };

            const summary = useMemo(() => {
                const items = [];
                inventory.forEach(p => {
                    const q = parseInt(stdQtys[p.id]) || 0;
                    if (q > 0) items.push({ id: p.id, name: p.name, price: stdPrices[p.id], qty: q, total: stdPrices[p.id] * q, type: '一般', baseId: p.id });
                    
                    const extras = extraStdItems[p.id] || [];
                    extras.forEach(ext => {
                        const eq = parseInt(ext.qty) || 0;
                        const ep = parseInt(ext.price) || 0;
                        if (eq > 0) {
                            items.push({
                                id: `ext-${p.id}-${ext.id}`,
                                name: p.name,
                                price: ep,
                                qty: eq,
                                total: ep * eq,
                                type: '另價',
                                baseId: p.id
                            });
                        }
                    });
                });

                limitedItems.forEach(i => {
                    items.push({ id: i.id, name: i.name, price: i.price, qty: i.qty, total: i.price * i.qty, type: '限定' });
                });
                sharingItems.forEach(i => {
                    items.push({ id: i.id, name: i.name, price: 0, qty: i.qty, total: 0, type: '分享' });
                });

                const subtotal = items.reduce((s,i)=>s+i.total, 0);
                const actualShip = ship.type === 'free' ? 0 : (parseInt(ship.fee) || 0);
                const actualDisc = parseInt(discount) || 0;
                const grandTotal = subtotal + actualShip - actualDisc;

                return { items, subtotal, actualShip, actualDisc, grandTotal };
            }, [stdQtys, stdPrices, extraStdItems, limitedItems, sharingItems, ship, discount, inventory]);

            const submitOrder = async () => {
                if (!orderer.isHandwritten && !orderer.name) return setSysMsg({ type: 'warning', title: '缺少資料', text: '請填寫姓名，或勾選「留白手寫」' });
                if (summary.items.length === 0) return setSysMsg({ type: 'warning', title: '缺少商品', text: '請至少選擇一項產品' });
                if (newLimited.name || newLimited.price || newLimited.qty) return setSysMsg({ type: 'warning', title: '有未加入的項目', text: '您在「期間限定」輸入了資料但尚未點擊【新增】。' });
                if (newSharing.name || newSharing.qty) return setSysMsg({ type: 'warning', title: '有未加入的項目', text: '您在「友情分享」輸入了資料但尚未點擊【分享】。' });

                let hasEmptyExtra = false;
                Object.values(extraStdItems).forEach(list => list.forEach(ext => { if (!ext.price || !ext.qty) hasEmptyExtra = true; }));
                if (hasEmptyExtra) return setSysMsg({type: 'warning', title: '多單價未填寫完整', text: '您有新增「其他單價」但未填寫金額或數量。'});
                
                setIsSyncing(true);

                try {
                    const newDbId = currentOrderId || Date.now().toString();
                    const orderData = { 
                        dbId: newDbId,
                        orderer, paymentStatus, creditAmount, stdQtys, stdPrices, jinPrices, extraStdItems, limitedItems, sharingItems, ship, discount, grandTotal: summary.grandTotal,
                        timestampMs: Date.now(),
                        timestampStr: new Date().toLocaleString('zh-TW')
                    };

                    if (isLocalMode) {
                        let newHistory = [...history];
                        const idx = newHistory.findIndex(h => h.dbId === newDbId);
                        if (idx >= 0) newHistory[idx] = orderData; else newHistory.unshift(orderData);
                        setHistory(newHistory);
                        localStorage.setItem('weiwei_history_v2', JSON.stringify(newHistory));
                    } else {
                        // 雲端模式：寫入訂單並扣減庫存
                        await fetchGas("saveOrder", orderData);
                        
                        // 準備更新後的庫存
                        let updatedInventory = [...inventory];
                        for (const item of summary.items) {
                            if (item.type === '一般' || item.type === '另價') {
                                const pIdx = updatedInventory.findIndex(x => x.id === item.baseId);
                                if (pIdx > -1 && !currentOrderId) {
                                    // 只有新訂單才會扣庫存
                                    updatedInventory[pIdx].stock -= item.qty;
                                }
                            }
                        }
                        
                        // 若是新訂單，更新庫存回雲端
                        if (!currentOrderId) {
                            await fetchGas("saveInventory", updatedInventory);
                            setInventory(updatedInventory);
                        }

                        // 更新本地歷史紀錄陣列以利立即顯示
                        let newHistory = [...history];
                        const idx = newHistory.findIndex(h => h.dbId === newDbId);
                        if (idx >= 0) newHistory[idx] = orderData; else newHistory.unshift(orderData);
                        newHistory.sort((a,b) => b.timestampMs - a.timestampMs); 
                        setHistory(newHistory);
                    }

                    setCurrentOrderId(newDbId);
                    setShowBill(true); 
                    window.scrollTo(0,0);
                } catch (e) {
                    console.error(e);
                    setSysMsg({ type: 'error', title: '產出失敗', text: '無法將訂單存入 Google 表單，請檢查連線。' });
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleConfirmAction = async () => {
                if (!confirmAction) return;
                
                if (confirmAction.type === 'reset' || confirmAction.type === 'next') {
                    clearAllState();
                } else if (confirmAction.type === 'deleteHistory') {
                    setIsSyncing(true);
                    if (isLocalMode) {
                        const newHistory = history.filter(h => h.dbId !== confirmAction.id);
                        setHistory(newHistory);
                        localStorage.setItem('weiwei_history_v2', JSON.stringify(newHistory));
                        if(currentOrderId === confirmAction.id) setCurrentOrderId(null);
                    } else {
                        try {
                            await fetchGas("deleteOrder", { dbId: confirmAction.id });
                            const newHistory = history.filter(h => h.dbId !== confirmAction.id);
                            setHistory(newHistory);
                            if(currentOrderId === confirmAction.id) setCurrentOrderId(null);
                        } catch(e) {
                            setSysMsg({ type: 'error', title: '刪除失敗', text: '無法從雲端刪除訂單。' });
                        }
                    }
                    setIsSyncing(false);
                    setConfirmAction(null);
                }
            };

            const handleScreenshot = async () => {
                const element = document.getElementById('capture-target');
                if (!element) return;
                const btn = document.getElementById('btn-screenshot');
                const originalText = btn.innerHTML;
                btn.innerText = "生成中..."; btn.disabled = true;
                
                try {
                    await new Promise(resolve => setTimeout(resolve, 300));
                    const canvas = await html2canvas(element, { 
                        scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false,
                        windowWidth: 800, width: 800,       
                        onclone: (clonedDoc) => {
                            const target = clonedDoc.getElementById('capture-target');
                            if (target) { target.style.width = '800px'; target.style.minWidth = '800px'; target.style.maxWidth = '800px'; }
                            const container = clonedDoc.getElementById('preview-container');
                            if (container) { container.style.width = '800px'; container.style.minWidth = '800px'; container.style.maxWidth = 'none'; container.style.overflow = 'visible'; }
                        }
                    });
                    const imgData = canvas.toDataURL("image/png");
                    const displayName = orderer.isHandwritten ? '手寫單' : orderer.name;
                    if (navigator.share) {
                        canvas.toBlob(async (blob) => {
                            const file = new File([blob], `葳葳海鮮訂單_${displayName}.png`, { type: "image/png" });
                            try { await navigator.share({ files: [file], title: '葳葳海鮮訂單', text: `這是 ${displayName} 的訂單` }); } catch (err) { setScreenshotUrl(imgData); }
                        }, 'image/png');
                    } else { setScreenshotUrl(imgData); }
                } catch (error) { 
                    setSysMsg({ type: 'error', title: '生成失敗', text: '處理圖片時發生錯誤。' }); 
                } finally { 
                    btn.innerHTML = originalText; btn.disabled = false; 
                }
            };

            const handleThermalPrint = async () => {
                const element = document.getElementById('thermal-receipt');
                if (!element) return;
                const btn = document.getElementById('btn-thermal');
                const originalText = btn.innerHTML;
                btn.innerText = "處理中..."; btn.disabled = true;
                try {
                    await new Promise(resolve => setTimeout(resolve, 300));
                    const canvas = await html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false });
                    const ctx = canvas.getContext('2d');
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const luminance = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                        const color = luminance < 200 ? 0 : 255; 
                        data[i] = color; data[i+1] = color; data[i+2] = color; data[i+3] = 255;    
                    }
                    ctx.putImageData(imageData, 0, 0);
                    const imgData = canvas.toDataURL("image/png");
                    const displayName = orderer.isHandwritten ? '手寫單' : orderer.name;
                    if (navigator.share) {
                        canvas.toBlob(async (blob) => {
                            const file = new File([blob], `葳葳海鮮_貼紙_${displayName}.png`, { type: "image/png" });
                            try { await navigator.share({ files: [file], title: '葳葳海鮮貼紙', text: `出貨貼紙圖檔` }); } catch (err) { setScreenshotUrl(imgData); }
                        }, 'image/png');
                    } else { setScreenshotUrl(imgData); }
                } catch (error) { setSysMsg({ type: 'error', title: '生成失敗', text: '處理貼紙圖檔時發生錯誤。' }); } 
                finally { btn.innerHTML = originalText; btn.disabled = false; }
            };

            const footerRowCount = summary.actualDisc > 0 ? 4 : 3; 

            return (
                <div className="min-h-screen p-3 md:p-8 flex flex-col items-center relative">
                    
                    {/* 全局 Loading 遮罩 */}
                    {isSyncing && (
                        <div className="fixed inset-0 bg-white/70 backdrop-blur-sm z-[10000] flex flex-col items-center justify-center">
                            <svg className="animate-spin w-16 h-16 text-sky-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" strokeOpacity="0.25"></circle>
                                <path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span className="text-xl font-black text-sky-800 tracking-widest">雲端同步中...</span>
                        </div>
                    )}

                    {/* 系統提示視窗 */}
                    {sysMsg && (
                        <div className="modal-overlay" onClick={() => setSysMsg(null)}>
                            <div className="bg-white p-6 md:p-8 rounded-3xl max-w-[90%] md:max-w-md w-full shadow-2xl flex flex-col items-center text-center max-h-[85vh] animate-in zoom-in-95 duration-300" onClick={e => e.stopPropagation()}>
                                {sysMsg.type === 'import_success' ? (
                                    <div className="[&>svg]:w-12 [&>svg]:h-12 md:[&>svg]:w-16 md:[&>svg]:h-16 text-emerald-500 mb-4 bg-emerald-50 p-4 rounded-full"><Icons.CheckCircle /></div>
                                ) : sysMsg.type === 'error' ? (
                                    <div className="[&>svg]:w-12 [&>svg]:h-12 md:[&>svg]:w-16 md:[&>svg]:h-16 text-rose-500 mb-4 bg-rose-50 p-4 rounded-full"><Icons.Alert /></div>
                                ) : (
                                    <div className="[&>svg]:w-12 [&>svg]:h-12 md:[&>svg]:w-16 md:[&>svg]:h-16 text-amber-500 mb-4 bg-amber-50 p-4 rounded-full"><Icons.Alert /></div>
                                )}
                                <h3 className="text-2xl md:text-3xl font-black text-slate-800 mb-2">{sysMsg.title}</h3>
                                <p className="text-sm md:text-base text-slate-500 font-bold mb-6 leading-relaxed whitespace-pre-line">{sysMsg.text}</p>
                                <button onClick={() => setSysMsg(null)} className="w-full py-3 md:py-4 rounded-xl font-black text-xl md:text-2xl bg-slate-900 text-white shadow-lg active:scale-95 transition-transform">確認</button>
                            </div>
                        </div>
                    )}

                    {/* 更新日誌視窗 */}
                    {showChangelog && (
                        <div className="modal-overlay" onClick={()=>setShowChangelog(false)}>
                            <div className="bg-white rounded-[2rem] w-full max-w-[95%] md:max-w-lg max-h-[85vh] flex flex-col shadow-2xl animate-in zoom-in-95 duration-300" onClick={e=>e.stopPropagation()}>
                                <div className="p-4 md:p-6 bg-purple-800 text-white rounded-t-[2rem] flex justify-between items-center">
                                    <h2 className="text-xl md:text-2xl font-black flex items-center gap-2"><Icons.FileText /> 系統更新日誌</h2>
                                    <button onClick={()=>setShowChangelog(false)}><Icons.Close /></button>
                                </div>
                                <div className="p-5 md:p-8 overflow-y-auto space-y-6 custom-scrollbar text-slate-700 bg-slate-50">
                                    <div className="relative pl-4 border-l-4 border-purple-500">
                                        <h3 className="font-black text-lg text-purple-800 mb-1">v0802-GAS (Google 表單雲端版)</h3>
                                        <p className="text-xs text-slate-400 mb-2 font-bold">2026/08/02</p>
                                        <ul className="list-disc pl-4 space-y-1 text-sm font-bold text-slate-600">
                                            <li><span className="text-purple-600">更換資料庫引擎</span>：以 Google Apps Script 取代 Firebase。</li>
                                            <li><span className="text-purple-600">直覺化後台</span>：歷史訂單、庫存報價皆會自動寫入您的 Google 試算表中，方便老闆隨時查閱與備份。</li>
                                        </ul>
                                    </div>
                                    <div className="relative pl-4 border-l-4 border-slate-300">
                                        <h3 className="font-black text-lg text-slate-700 mb-1">v0801 (防擠壓排版)</h3>
                                        <p className="text-xs text-slate-400 mb-2 font-bold">歷史版本</p>
                                        <ul className="list-disc pl-4 space-y-1 text-sm font-bold text-slate-500">
                                            <li>解決手機開啟「字體放大」或「網頁縮放」時排版被擠爆的問題。</li>
                                        </ul>
                                    </div>
                                </div>
                                <div className="p-4 bg-white border-t border-slate-100 rounded-b-[2rem]">
                                    <button onClick={()=>setShowChangelog(false)} className="w-full py-3 bg-purple-100 text-purple-800 rounded-xl font-black text-lg shadow-sm active:scale-95 transition-transform">我知道了</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 報價視窗 */}
                    {showPriceModal && (
                        <div className="fixed inset-0 z-[9998] bg-black/80 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2rem] w-full max-w-[95%] md:max-w-lg max-h-[90vh] flex flex-col shadow-2xl animate-in zoom-in-95 duration-300">
                                <div className="p-4 md:p-6 bg-sky-800 text-white rounded-t-[2rem] flex justify-between items-center shadow-md z-10">
                                    <h2 className="text-2xl md:text-3xl font-black flex items-center gap-2 md:gap-3"><Icons.Dollar /> 今日報價總覽</h2>
                                </div>
                                <div className="p-4 md:p-6 overflow-y-auto flex-1 bg-slate-50 space-y-3 md:space-y-4 custom-scrollbar">
                                    <p className="text-slate-500 font-bold mb-2 text-sm md:text-lg">確認或修改今日各品項單價：<br/><span className="text-sky-700 text-xs md:text-sm">(修改後將儲存至 Google 試算表，今日接單皆使用此價格)</span></p>
                                    {inventory.map(p => (
                                        <div key={p.id} className="flex flex-col bg-white p-3 md:p-4 rounded-2xl border-2 border-slate-200 shadow-sm hover:border-sky-300 transition-colors">
                                            <div className="font-black text-lg md:text-xl text-slate-800 leading-tight mb-2 flex items-baseline justify-between">
                                                <span>{p.name}</span>
                                                <span className="text-xs md:text-sm font-bold text-slate-400">{p.unit}</span>
                                            </div>
                                            <div className="flex gap-2 md:gap-3">
                                                {p.defJinPrice !== undefined && (
                                                    <div className="flex-1 flex items-center bg-indigo-50 rounded-xl p-1.5 md:p-2 border-2 border-indigo-200 focus-within:border-indigo-400 focus-within:bg-white transition-colors min-w-0">
                                                        <span className="text-indigo-700 font-bold text-xs md:text-sm mr-1 shrink-0 whitespace-nowrap">斤價$</span>
                                                        <input type="number" value={jinPrices[p.id]} onChange={e => setJinPrices({...jinPrices, [p.id]: parseInt(e.target.value) || 0})} className="w-full min-w-0 text-center text-lg md:text-2xl font-black bg-transparent outline-none text-slate-800" />
                                                    </div>
                                                )}
                                                <div className="flex-1 flex items-center bg-amber-50 rounded-xl p-1.5 md:p-2 border-2 border-amber-200 focus-within:border-amber-400 focus-within:bg-white transition-colors min-w-0">
                                                    <span className="text-amber-700 font-bold text-xs md:text-sm mr-1 shrink-0 whitespace-nowrap">單價$</span>
                                                    <input type="number" value={stdPrices[p.id]} onChange={e => setStdPrices({...stdPrices, [p.id]: parseInt(e.target.value) || 0})} className="w-full min-w-0 text-center text-lg md:text-2xl font-black bg-transparent outline-none text-slate-800" />
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-3 md:p-4 bg-white border-t-4 border-slate-100 rounded-b-[2rem]">
                                    <button onClick={savePricesToDb} className="w-full bg-sky-700 text-white py-3 md:py-4 rounded-xl font-black text-lg md:text-xl shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
                                        <Icons.Check /> 儲存並開始接單
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 庫存管理視窗 */}
                    {showInventoryPanel && (
                        <div className="modal-overlay" onClick={()=>setShowInventoryPanel(false)}>
                            <div className="bg-white rounded-[2rem] w-full max-w-[95%] md:max-w-lg max-h-[90vh] flex flex-col shadow-2xl animate-in zoom-in-95 duration-300" onClick={e=>e.stopPropagation()}>
                                <div className="p-4 md:p-6 bg-amber-600 text-white rounded-t-[2rem] flex justify-between items-center shadow-md z-10">
                                    <h2 className="text-xl md:text-2xl font-black flex items-center gap-2 md:gap-3"><Icons.Package /> 庫存管理</h2>
                                    <button onClick={()=>setShowInventoryPanel(false)}><Icons.Close /></button>

                                        <span className="font-bold text-sm md:text-lg hidden xs:inline">明細</span>
                                    </button>
                                    
                                    <button onClick={submitOrder} className="flex-1 flex items-center justify-center gap-1 md:gap-2 bg-emerald-500 hover:bg-emerald-400 text-white px-3 md:px-6 py-3 md:py-4 rounded-xl md:rounded-2xl shadow-lg transition-all active:scale-95">
                                        <Icons.Check />
                                        <span className="font-black text-lg md:text-2xl tracking-widest whitespace-nowrap">產出訂單</span>
                                    </button>

                                    <div className="flex flex-col items-end min-w-[80px] md:min-w-[120px]">
                                        <span className="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-widest">Total</span>
                                        <span className="text-2xl md:text-5xl font-black text-white tracking-tighter leading-none">${summary.grandTotal}</span>
                                    </div>
                                </div>
                            </div>

                            {/* 側邊明細抽屜 */}
                            <div className={`fixed top-0 left-0 h-full w-72 md:w-80 max-w-[85%] bg-white shadow-2xl z-50 drawer-transition ${showDetailDrawer ? 'translate-x-0' : '-translate-x-full'}`}>
                                <div className="p-3 md:p-4 bg-slate-800 text-white font-black text-lg md:text-xl flex justify-between items-center">
                                    <span>📝 已選明細</span>
                                    <button onClick={()=>setShowDetailDrawer(false)}><Icons.ChevronLeft /></button>
                                </div>
                                <div className="overflow-y-auto p-3 md:p-4 space-y-2 md:space-y-3 h-[calc(100%-60px)]">
                                    {summary.items.length === 0 ? (
                                        <p className="text-center text-slate-400 py-8 text-sm">尚未選擇任何商品</p>
                                    ) : (
                                        summary.items.map((item, idx) => {
                                            const isSameAsPrev = idx > 0 && item.baseId && summary.items[idx - 1].baseId === item.baseId && (item.type === '一般' || item.type === '另價') && (summary.items[idx - 1].type === '一般' || summary.items[idx - 1].type === '另價');
                                            return (
                                                <div key={idx} className="flex justify-between items-center py-2 md:py-3 border-b border-slate-100 last:border-0">
                                                    <div className="flex-1 pr-2 overflow-hidden">
                                                        <div className={`font-medium text-slate-800 text-base md:text-xl truncate ${isSameAsPrev ? 'opacity-0' : ''}`}>
                                                            {item.name} 
                                                            {item.type === '分享' && <span className="ml-1 md:ml-2 text-[10px] md:text-xs bg-emerald-100 text-emerald-700 px-1 md:px-2 py-0.5 rounded font-bold">分享</span>}
                                                        </div>
                                                        <div className="text-xs md:text-sm text-slate-400 mt-0.5 md:mt-1">
                                                            ${item.price} x {item.qty}
                                                        </div>
                                                    </div>
                                                    <div className="font-black text-lg md:text-2xl text-slate-800">
                                                        ${item.total}
                                                    </div>
                                                </div>
                                            )
                                        })
                                    )}
                                    <div className="pt-3 md:pt-4 mt-3 md:mt-4 border-t-2 border-slate-100 space-y-1 md:space-y-2 text-sm md:text-base">
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-slate-500">小計</span>
                                            <span className="font-black text-lg md:text-xl text-slate-800">${summary.subtotal}</span>
                                        </div>
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-slate-500">運費</span>
                                            <span className="font-black text-lg md:text-xl text-slate-800">+${summary.actualShip}</span>
                                        </div>
                                        {summary.actualDisc > 0 && (
                                            <div className="flex justify-between items-center text-amber-600">
                                                <span className="font-bold">折讓</span>
                                                <span className="font-black text-lg md:text-xl">-${summary.actualDisc}</span>
                                            </div>
                                        )}
                                        <div className="flex justify-between items-center pt-2 border-t border-slate-200">
                                            <span className="font-black text-base md:text-lg text-slate-800">應付總額</span>
                                            <span className="font-black text-2xl md:text-3xl text-red-600">${summary.grandTotal}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            {showDetailDrawer && (
                                <div className="fixed inset-0 bg-black/50 z-40" onClick={()=>setShowDetailDrawer(false)}></div>
                            )}
                        </>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        // 加入 Error Boundary 保護整個應用程式
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
