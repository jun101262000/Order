<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>葳葳海鮮 - 雲端訂購系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        html { font-size: 16px !important; }
        body { font-family: 'Noto Sans TC', sans-serif; line-height: 1.4; -webkit-text-size-adjust: 100%; padding-bottom: 240px; }
        .order-table th { padding: 12px 8px; border-bottom: 3px solid #000; color: #000; }
        .order-table td { padding: 16px 8px; border-bottom: 1px solid #cbd5e1; color: #000; }
        input:focus { border-color: #0369a1 !important; outline: none; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
        .drawer-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        #thermal-receipt { position: absolute; left: -9999px; top: 0; width: 800px; min-height: 1200px; background: #ffffff; color: #000000; padding: 40px; box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif; border: 4px solid #000000; -webkit-font-smoothing: none; text-rendering: optimizeSpeed; }
        .thermal-header { text-align: center; border-bottom: 6px solid #000; padding-bottom: 20px; margin-bottom: 20px; }
        .thermal-title { font-size: 64px; font-weight: 900; line-height: 1; color: #000; }
        .thermal-meta { font-size: 26px; margin-top: 10px; font-weight: 900; color: #000; }
        .thermal-info { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 4px solid #000; padding-bottom: 20px; }
        .thermal-customer { font-size: 46px; font-weight: 900; color: #000; word-break: break-all; }
        .thermal-phone { font-size: 34px; font-weight: 900; color: #000; margin-top: 5px; }
        .thermal-address { font-size: 30px; font-weight: 900; color: #000; margin-top: 10px; line-height: 1.3; }
        .thermal-status { font-size: 32px; font-weight: 900; border: 4px solid #000; padding: 5px 15px; border-radius: 10px; display: inline-block; margin-top: 10px; color: #000; }
        .thermal-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .thermal-table th { border-bottom: 4px solid #000; text-align: left; font-size: 30px; padding: 10px 0; color: #000; font-weight: 900; }
        .thermal-table td { border-bottom: 2px dashed #000; font-size: 48px; padding: 15px 0; font-weight: 400; color: #000; } 
        .thermal-footer { border-top: 6px solid #000; padding-top: 20px; }
        .thermal-total-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
        .thermal-total-label { font-size: 34px; font-weight: 900; color: #000; }
        .thermal-total-amount { font-size: 80px; font-weight: 900; line-height: 1; color: #000; }
        .thermal-contact { text-align: left; margin-top: 30px; color: #000; border-top: 4px solid #000; padding-top: 20px; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; padding-bottom: 0; }
            .print-container { width: 100%; border: none; box-shadow: none; }
            tr.even-row { background-color: #f1f5f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #475569; background-color: #f8fafc;">
            <svg style="animation: spin 1s linear infinite; width: 50px; height: 50px; margin-bottom: 20px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" stroke-opacity="0.25"></circle><path fill="#0284c7" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">系統初始化中...</h2>
            <p>如果此畫面停留超過 5 秒，請重新整理網頁</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // ==========================================
        // 您的專屬 Google Apps Script 網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwe4dEAFMD-3lkgQUl3PXfu_sJb419LqS04bJnz5CRB_fa-QRQU6eyrJmIjf4d7nuYa/exec";
        // ==========================================

        const Icons = {
            Anchor: () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8 md:w-10 md:h-10"><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/><circle cx="12" cy="5" r="3"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Camera: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6 md:w-7 md:h-7"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>,
            Printer: () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>,
            Close: () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            History: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>,
            Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>,
            ChevronLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
            Alert: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><polyline points="20 6 9 17 4 12"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            CreditCard: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/><line x1="10" x2="10" y1="15" y2="15"/></svg>,
            Package: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            Dollar: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 md:w-6 md:h-6"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>,
            CloudOff: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m2 2 20 20"/><path d="M5.78 5.78a7 7 0 0 0 9.24 9.24"/><path d="M8.2 8.2c-.32.06-.65.1-.98.15-2.77.45-4.8 2.8-4.8 5.65 0 3.1 2.5 5.6 5.6 5.6h10.4"/><path d="M17.4 17.4A7 7 0 0 0 22 11.5c0-3.6-2.9-6.5-6.5-6.5a6.5 6.5 0 0 0-4.6 1.8"/></svg>
        };

        const DEFAULT_PRODUCTS = [
            { id: 1, name: '整尾無刺虱目魚', unit: '尾', defPrice: 220, range: '170~220', canEdit: true, defJinPrice: 190 },
            { id: 2, name: '去頭尾半尾魚', unit: '片', defPrice: 170, range: '110~170', canEdit: true, defJinPrice: 240 },
            { id: 3, name: '透抽', unit: '尾', defPrice: 330, range: '180~330', canEdit: true, note: '依重量', defJinPrice: 330 },
            { id: 4, name: '魚肚', unit: '片(200~240g)', defPrice: 130, canEdit: true },
            { id: 5, name: '魚柳', unit: '包(半斤)', defPrice: 70, canEdit: true },
            { id: 6, name: '魚嶺(已調味)', unit: '包(半斤)', defPrice: 110, canEdit: true },
            { id: 7, name: '魚皮', unit: '包(半斤)', defPrice: 70, canEdit: true },
            { id: 8, name: '生蝦', unit: '包(500g)', defPrice: 270, canEdit: true },
            { id: 9, name: '熟蝦(退冰即可食)', unit: '包(500g)', defPrice: 270, canEdit: true },
            { id: 10, name: '蝦仁', unit: '包(150g)', defPrice: 120, canEdit: true },
            { id: 11, name: '挪威鯖魚(微刺)', unit: '片', defPrice: 80, canEdit: true },
            { id: 12, name: '吳郭魚(台灣鯛)', unit: '大尾', defPrice: 100, range: '80~100', canEdit: true },
            { id: 13, name: '學甲虱目魚丸(真空包)', unit: '包(1斤)', defPrice: 120, canEdit: true, defJinPrice: 120 },
            { id: 14, name: '花枝丸', unit: '包(1斤)', defPrice: 300, canEdit: true, defJinPrice: 300 },
            { id: 15, name: '花枝月亮蝦餅', unit: '包', defPrice: 360, canEdit: true },
            { id: 16, name: '花枝蝦排', unit: '包', defPrice: 360, canEdit: true },
        ];

        const fetchGas = async (action, payload = null) => {
            if (!GAS_URL || GAS_URL.includes("您的_GAS_網址")) throw new Error("尚未設定 Google Apps Script 網址");
            const res = await fetch(GAS_URL, action === 'init' ? undefined : {
                method: 'POST', headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, payload })
            });
            if (!res.ok) throw new Error("網路連線異常");
            return await res.json();
        }

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, errorInfo: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error }; }
            render() {
                if (this.state.hasError) return (
                    <div style={{ padding: '20px', textAlign: 'center', fontFamily: 'sans-serif' }}>
                        <h2 style={{ color: 'red', fontWeight: 'bold' }}>系統發生錯誤</h2>
                        <p>{this.state.errorInfo?.toString()}</p>
                        <button onClick={() => window.location.reload()} style={{ padding: '10px 20px', marginTop: '20px', background: '#0ea5e9', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer' }}>重新整理</button>
                    </div>
                );
                return this.props.children;
            }
        }

        function MainApp() {
            // 所有 Hook 必須在這裡宣告，絕不可放在條件式之後！
            const [dbReady, setDbReady] = useState(false);
            const [isLocalMode, setIsLocalMode] = useState(false);
            const [initError, setInitError] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false); 

            const [showPriceModal, setShowPriceModal] = useState(false);
            const [showChangelog, setShowChangelog] = useState(false);
            const [showInventoryPanel, setShowInventoryPanel] = useState(false);
            const [showHistory, setShowHistory] = useState(false);
            const [sysMsg, setSysMsg] = useState(null);

            const [inventory, setInventory] = useState([]);
            const [history, setHistory] = useState([]);

            const [orderer, setOrderer] = useState({ name: '', phone: '', address: '', isHandwritten: false });
            const [paymentStatus, setPaymentStatus] = useState('pending');
            const [creditAmount, setCreditAmount] = useState('');
            
            const [stdQtys, setStdQtys] = useState({});
            const [stdPrices, setStdPrices] = useState({});
            const [jinPrices, setJinPrices] = useState({});
            const [extraStdItems, setExtraStdItems] = useState({});
            
            const [limitedItems, setLimitedItems] = useState([]);
            const [newLimited, setNewLimited] = useState({ name: '', price: '', qty: '' });
            const [sharingItems, setSharingItems] = useState([]);
            const [newSharing, setNewSharing] = useState({ name: '', qty: '' });
            
            const [ship, setShip] = useState({ type: 'free', fee: '' });
            const [discount, setDiscount] = useState('');
            
            const [showBill, setShowBill] = useState(false);
            const [screenshotUrl, setScreenshotUrl] = useState(null);
            const [currentOrderId, setCurrentOrderId] = useState(null);
            const [confirmAction, setConfirmAction] = useState(null); 

            const loadDataFromGAS = async () => {
                try {
                    setInitError(null);
                    const res = await fetchGas('init');
                    if(res && res.error) throw new Error(res.error);

                    let items = res.inventory || [];
                    if (items.length === 0) {
                        items = DEFAULT_PRODUCTS.map(p => ({...p, stock: 0}));
                        await fetchGas('saveInventory', items);
                    }
                    items.sort((a,b) => a.id - b.id);
                    setInventory(items);
                    
                    const newStd = {}; const newJin = {};
                    items.forEach(item => {
                        newStd[item.id] = item.defPrice !== undefined ? item.defPrice : 0;
                        if(item.defJinPrice !== undefined) newJin[item.id] = item.defJinPrice;
                    });
                    setStdPrices(newStd); setJinPrices(newJin);

                    let ords = res.orders || [];
                    ords.sort((a,b) => b.timestampMs - a.timestampMs); 
                    setHistory(ords);

                    setDbReady(true);
                    if(!window.hasShownPriceModal) { setShowPriceModal(true); window.hasShownPriceModal = true; }
                } catch (error) {
                    console.error("GAS 連線失敗", error);
                    setInitError(error.message || "連線失敗，請檢查網址或網路狀態。");
                }
            };

            useEffect(() => { if (!dbReady && !isLocalMode) loadDataFromGAS(); }, [dbReady, isLocalMode]);

            const startLocalMode = () => {
                setIsLocalMode(true); setDbReady(true);
                setInventory(DEFAULT_PRODUCTS.map(p => ({...p, stock: 0})));
                const newStd = {}; const newJin = {};
                DEFAULT_PRODUCTS.forEach(item => { newStd[item.id] = item.defPrice; if(item.defJinPrice) newJin[item.id] = item.defJinPrice; });
                setStdPrices(newStd); setJinPrices(newJin);

                const saved = localStorage.getItem('weiwei_history_v2');
                if (saved) { try { setHistory(JSON.parse(saved)); } catch(e) {} }
                setInitError(null); setShowPriceModal(true); 
            };

            const summary = useMemo(() => {
                try {
                    const items = [];
                    inventory.forEach(p => {
                        const q = parseInt(stdQtys[p.id]) || 0;
                        if (q > 0) items.push({ uid: `std-${p.id}`, id: p.id, name: p.name, price: stdPrices[p.id] || 0, qty: q, total: (stdPrices[p.id] || 0) * q, type: '一般', baseId: p.id });
                        const extras = extraStdItems[p.id] || [];
                        extras.forEach(ext => {
                            const eq = parseInt(ext.qty) || 0; const ep = parseInt(ext.price) || 0;
                            if (eq > 0) items.push({ uid: `ext-${p.id}-${ext.id}`, id: ext.id, name: p.name, price: ep, qty: eq, total: ep * eq, type: '另價', baseId: p.id });
                        });
                    });

                    limitedItems.forEach((i, idx) => items.push({ uid: `lmt-${i.id}-${idx}`, id: i.id, name: i.name, price: i.price, qty: i.qty, total: i.price * i.qty, type: '限定' }));
                    sharingItems.forEach((i, idx) => items.push({ uid: `shr-${i.id}-${idx}`, id: i.id, name: i.name, price: 0, qty: i.qty, total: 0, type: '分享' }));

                    const subtotal = items.reduce((s,i)=>s+i.total, 0);
                    const actualShip = ship.type === 'free' ? 0 : (parseInt(ship.fee) || 0);
                    const actualDisc = parseInt(discount) || 0;
                    const grandTotal = subtotal + actualShip - actualDisc;
                    return { items, subtotal, actualShip, actualDisc, grandTotal };
                } catch (err) {
                    console.error("Summary 計算錯誤", err);
                    return { items: [], subtotal: 0, actualShip: 0, actualDisc: 0, grandTotal: 0 };
                }
            }, [stdQtys, stdPrices, extraStdItems, limitedItems, sharingItems, ship, discount, inventory]);

            if (!dbReady && !isLocalMode) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-100 p-4">
                        {!initError ? (
                            <div className="flex flex-col items-center">
                                <svg className="animate-spin w-12 h-12 text-sky-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" strokeOpacity="0.25"></circle><path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                <h2 className="text-xl font-bold text-slate-700 mb-2">Google 試算表連線中...</h2>
                                <button onClick={startLocalMode} className="mt-8 px-6 py-2 rounded-full border-2 border-slate-300 text-slate-500 font-bold hover:bg-slate-200">略過連線，使用單機版</button>
                            </div>
                        ) : (
                            <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-2xl max-w-[90%] w-full text-center flex flex-col items-center">
                                <div className="text-amber-500 mb-4 bg-amber-50 p-4 rounded-full"><Icons.CloudOff /></div>
                                <h2 className="text-2xl font-black text-slate-800 mb-3">無法連線至雲端</h2>
                                <p className="text-slate-600 font-bold mb-6 text-sm">{initError}</p>
                                <button onClick={startLocalMode} className="w-full py-3 md:py-4 rounded-xl font-black text-lg bg-slate-800 text-white shadow-lg mb-3">強制進入單機測試模式</button>
                                <button onClick={() => {setInitError(null); loadDataFromGAS();}} className="w-full py-3 md:py-4 rounded-xl font-bold text-lg text-slate-600 bg-slate-100 flex items-center justify-center gap-2"><Icons.Refresh /> 重新嘗試</button>
                            </div>
                        )}
                    </div>
                );
            }

            const clearAllState = () => {
                setOrderer({ name: '', phone: '', address: '', isHandwritten: false });
                setPaymentStatus('pending'); setCreditAmount('');
                setStdQtys({}); setExtraStdItems({}); setLimitedItems([]); setSharingItems([]);
                setShip({ type: 'free', fee: '' }); setDiscount('');
                setNewLimited({ name: '', price: '', qty: '' }); setNewSharing({ name: '', qty: '' });
                setCurrentOrderId(null); setShowBill(false); setScreenshotUrl(null); window.scrollTo(0, 0); setConfirmAction(null);
            };

            const loadFromHistory = (d) => {
                setOrderer(d.orderer || { name: '', phone: '', address: '', isHandwritten: false });
                setPaymentStatus(d.paymentStatus || 'pending'); setCreditAmount(d.creditAmount || '');
                setStdQtys(d.stdQtys || {}); setExtraStdItems(d.extraStdItems || {});
                setLimitedItems(d.limitedItems || []); setSharingItems(d.sharingItems || []);
                setShip(d.ship || { type: 'free', fee: '' }); setDiscount(d.discount || '');
                setCurrentOrderId(d.dbId); setShowHistory(false); setShowBill(false); window.scrollTo(0,0);
            };

            const handleAddExtra = (pid) => {
                setExtraStdItems(prev => ({ ...prev, [pid]: [...(prev[pid] || []), { id: Date.now().toString() + Math.random().toString(36).substring(7), price: '', qty: '' }] }));
            };
            const updateExtra = (pid, extId, field, value) => {
                setExtraStdItems(prev => ({ ...prev, [pid]: (prev[pid] || []).map(item => item.id === extId ? { ...item, [field]: value } : item) }));
            };
            const removeExtra = (pid, extId) => {
                setExtraStdItems(prev => ({ ...prev, [pid]: (prev[pid] || []).filter(item => item.id !== extId) }));
            };

            const savePricesToDb = async () => {
                if (isLocalMode) return setShowPriceModal(false);
                setIsSyncing(true);
                try {
                    const newInventory = inventory.map(p => ({ ...p, defPrice: stdPrices[p.id] !== undefined ? stdPrices[p.id] : p.defPrice, defJinPrice: jinPrices[p.id] !== undefined ? jinPrices[p.id] : p.defJinPrice }));
                    await fetchGas("saveInventory", newInventory);
                    setInventory(newInventory); setShowPriceModal(false);
                } catch(e) { setSysMsg({ type: 'error', title: '儲存失敗', text: '無法儲存報價至雲端。' }); }
                finally { setIsSyncing(false); }
            };

            const handleFinishInventory = async () => {
                if (isLocalMode) return setShowInventoryPanel(false);
                setIsSyncing(true);
                try { await fetchGas("saveInventory", inventory); setShowInventoryPanel(false); } 
                catch(e) { setSysMsg({ type: 'error', title: '儲存失敗', text: '無法更新庫存至雲端。' }); } 
                finally { setIsSyncing(false); }
            };

            const submitOrder = async () => {
                if (!orderer.isHandwritten && !orderer.name) return setSysMsg({ type: 'warning', title: '缺少資料', text: '請填寫姓名或勾選「留白手寫」' });
                if (summary.items.length === 0) return setSysMsg({ type: 'warning', title: '缺少商品', text: '請至少選擇一項產品' });
                if (newLimited.name || newLimited.qty) return setSysMsg({ type: 'warning', title: '未加入項目', text: '期間限定有未加入的資料' });
                if (newSharing.name || newSharing.qty) return setSysMsg({ type: 'warning', title: '未加入項目', text: '友情分享有未加入的資料' });

                setIsSyncing(true);
                try {
                    const newDbId = currentOrderId || Date.now().toString();
                    const orderData = { dbId: newDbId, orderer, paymentStatus, creditAmount, stdQtys, stdPrices, jinPrices, extraStdItems, limitedItems, sharingItems, ship, discount, grandTotal: summary.grandTotal, timestampMs: Date.now(), timestampStr: new Date().toLocaleString('zh-TW') };

                    if (isLocalMode) {
                        let newHistory = [...history];
                        const idx = newHistory.findIndex(h => h.dbId === newDbId);
                        if (idx >= 0) newHistory[idx] = orderData; else newHistory.unshift(orderData);
                        setHistory(newHistory); localStorage.setItem('weiwei_history_v2', JSON.stringify(newHistory));
                    } else {
                        await fetchGas("saveOrder", orderData);
                        let updatedInventory = [...inventory];
                        if (!currentOrderId) {
                            for (const item of summary.items) {
                                if (item.type === '一般' || item.type === '另價') {
                                    const pIdx = updatedInventory.findIndex(x => x.id === item.baseId);
                                    if (pIdx > -1) updatedInventory[pIdx].stock -= item.qty;
                                }
                            }
                            await fetchGas("saveInventory", updatedInventory);
                            setInventory(updatedInventory);
                        }
                        let newHistory = [...history];
                        const idx = newHistory.findIndex(h => h.dbId === newDbId);
                        if (idx >= 0) newHistory[idx] = orderData; else newHistory.unshift(orderData);
                        newHistory.sort((a,b) => b.timestampMs - a.timestampMs); setHistory(newHistory);
                    }
                    setCurrentOrderId(newDbId); setShowBill(true); window.scrollTo(0,0);
                } catch (e) { setSysMsg({ type: 'error', title: '產出失敗', text: '請檢查連線。' }); }
                finally { setIsSyncing(false); }
            };

            const handleConfirmAction = async () => {
                if (!confirmAction) return;
                if (confirmAction.type === 'reset' || confirmAction.type === 'next') clearAllState();
                else if (confirmAction.type === 'deleteHistory') {
                    setIsSyncing(true);
                    if (isLocalMode) {
                        const newHistory = history.filter(h => h.dbId !== confirmAction.id);
                        setHistory(newHistory); localStorage.setItem('weiwei_history_v2', JSON.stringify(newHistory));
                        if(currentOrderId === confirmAction.id) setCurrentOrderId(null);
                    } else {
                        try {
                            await fetchGas("deleteOrder", { dbId: confirmAction.id });
                            setHistory(history.filter(h => h.dbId !== confirmAction.id));
                            if(currentOrderId === confirmAction.id) setCurrentOrderId(null);
                        } catch(e) { setSysMsg({ type: 'error', title: '刪除失敗', text: '無法刪除。' }); }
                    }
                    setIsSyncing(false); setConfirmAction(null);
                }
            };

            const handleScreenshot = async () => {
                const element = document.getElementById('capture-target');
                if (!element) return;
                const btn = document.getElementById('btn-screenshot');
                const originalText = btn.innerHTML;
                btn.innerText = "生成中..."; btn.disabled = true;
                try {
                    await new Promise(resolve => setTimeout(resolve, 300));
                    const canvas = await html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false, windowWidth: 800, width: 800 });
                    const imgData = canvas.toDataURL("image/png");
                    const displayName = orderer.isHandwritten ? '手寫單' : orderer.name;
                    if (navigator.share) {
                        canvas.toBlob(async (blob) => {
                            const file = new File([blob], `葳葳海鮮訂單_${displayName}.png`, { type: "image/png" });
                            try { await navigator.share({ files: [file], title: '葳葳海鮮訂單', text: `這是 ${displayName} 的訂單` }); } catch (err) { setScreenshotUrl(imgData); }
                        }, 'image/png');
                    } else { setScreenshotUrl(imgData); }
                } catch (error) { setSysMsg({ type: 'error', title: '生成失敗', text: '處理圖片時發生錯誤。' }); } 
                finally { btn.innerHTML = originalText; btn.disabled = false; }
            };

            const handleThermalPrint = async () => {
                const element = document.getElementById('thermal-receipt');
                if (!element) return;
                const btn = document.getElementById('btn-thermal');
                const originalText = btn.innerHTML;
                btn.innerText = "處理中..."; btn.disabled = true;
                try {
                    await new Promise(resolve => setTimeout(resolve, 300));
                    const canvas = await html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false });
                    const ctx = canvas.getContext('2d');
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const color = (0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]) < 200 ? 0 : 255; 
                        data[i] = color; data[i+1] = color; data[i+2] = color; data[i+3] = 255;    
                    }
                    ctx.putImageData(imageData, 0, 0);
                    const imgData = canvas.toDataURL("image/png");
                    const displayName = orderer.isHandwritten ? '手寫單' : orderer.name;
                    if (navigator.share) {
                        canvas.toBlob(async (blob) => {
                            const file = new File([blob], `葳葳海鮮_貼紙_${displayName}.png`, { type: "image/png" });
                            try { await navigator.share({ files: [file], title: '葳葳海鮮貼紙', text: `出貨貼紙圖檔` }); } catch (err) { setScreenshotUrl(imgData); }
                        }, 'image/png');
                    } else { setScreenshotUrl(imgData); }
                } catch (error) { setSysMsg({ type: 'error', title: '生成失敗', text: '處理貼紙圖檔時發生錯誤。' }); } 
                finally { btn.innerHTML = originalText; btn.disabled = false; }
            };

            return (
                <div className="min-h-screen p-3 md:p-8 flex flex-col items-center relative">
                    {isSyncing && (
                        <div className="fixed inset-0 bg-white/70 backdrop-blur-sm z-[10000] flex flex-col items-center justify-center">
                            <svg className="animate-spin w-16 h-16 text-sky-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" strokeOpacity="0.25"></circle><path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            <span className="text-xl font-black text-sky-800 tracking-widest">雲端同步中...</span>
                        </div>
                    )}

                    {sysMsg && (
                        <div className="modal-overlay" onClick={() => setSysMsg(null)}>
                            <div className="bg-white p-6 md:p-8 rounded-3xl max-w-[90%] md:max-w-md w-full shadow-2xl flex flex-col items-center text-center max-h-[85vh] animate-in zoom-in-95 duration-300" onClick={e => e.stopPropagation()}>
                                <div className="[&>svg]:w-12 [&>svg]:h-12 md:[&>svg]:w-16 md:[&>svg]:h-16 text-amber-500 mb-4 bg-amber-50 p-4 rounded-full"><Icons.Alert /></div>
                                <h3 className="text-2xl md:text-3xl font-black text-slate-800 mb-2">{sysMsg.title}</h3>
                                <p className="text-sm md:text-base text-slate-500 font-bold mb-6">{sysMsg.text}</p>
                                <button onClick={() => setSysMsg(null)} className="w-full py-3 md:py-4 rounded-xl font-black text-xl md:text-2xl bg-slate-900 text-white shadow-lg active:scale-95 transition-transform">確認</button>
                            </div>
                        </div>
                    )}

                    {showPriceModal && (
                        <div className="fixed inset-0 z-[9998] bg-black/80 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2rem] w-full max-w-[95%] md:max-w-lg max-h-[90vh] flex flex-col shadow-2xl animate-in zoom-in-95 duration-300">
                                <div className="p-4 md:p-6 bg-sky-800 text-white rounded-t-[2rem] flex justify-between items-center shadow-md z-10">
                                    <h2 className="text-2xl md:text-3xl font-black flex items-center gap-2"><Icons.Dollar /> 今日報價總覽</h2>
                                </div>
                                <div className="p-4 md:p-6 overflow-y-auto flex-1 bg-slate-50 space-y-3 md:space-y-4 custom-scrollbar">
                                    <p className="text-slate-500 font-bold mb-2 text-sm md:text-lg">確認或修改今日各品項單價：</p>
                                    {inventory.map(p => (
                                        <div key={p.id} className="flex flex-col bg-white p-3 md:p-4 rounded-2xl border-2 border-slate-200 shadow-sm hover:border-sky-300 transition-colors">
                                            <div className="font-black text-lg md:text-xl text-slate-800 leading-tight mb-2 flex justify-between">
                                                <span>{p.name}</span><span className="text-xs md:text-sm font-bold text-slate-400">{p.unit}</span>
                                            </div>
                                            <div className="flex gap-2">
                                                {p.defJinPrice !== undefined && (
                                                    <div className="flex-1 flex items-center bg-indigo-50 rounded-xl p-1.5 border-2 border-indigo-200"><span className="text-indigo-700 font-bold text-xs mr-1 shrink-0">斤價$</span><input type="number" value={jinPrices[p.id]} onChange={e => setJinPrices({...jinPrices, [p.id]: parseInt(e.target.value) || 0})} className="w-full min-w-0 text-center text-lg md:text-2xl font-black bg-transparent outline-none" /></div>
                                                )}
                                                <div className="flex-1 flex items-center bg-amber-50 rounded-xl p-1.5 border-2 border-amber-200"><span className="text-amber-700 font-bold text-xs mr-1 shrink-0">單價$</span><input type="number" value={stdPrices[p.id]} onChange={e => setStdPrices({...stdPrices, [p.id]: parseInt(e.target.value) || 0})} className="w-full min-w-0 text-center text-lg md:text-2xl font-black bg-transparent outline-none" /></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-3 md:p-4 bg-white border-t-4 border-slate-100 rounded-b-[2rem]">
                                    <button onClick={savePricesToDb} className="w-full bg-sky-700 text-white py-3 md:py-4 rounded-xl font-black text-lg shadow-lg flex items-center justify-center gap-2"><Icons.Check /> 儲存並開始接單</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showInventoryPanel && (
                        <div className="modal-overlay" onClick={()=>setShowInventoryPanel(false)}>
                            <div className="bg-white rounded-[2rem] w-full max-w-[95%] md:max-w-lg max-h-[90vh] flex flex-col shadow-2xl animate-in zoom-in-95 duration-300" onClick={e=>e.stopPropagation()}>
                                <div className="p-4 md:p-6 bg-amber-600 text-white rounded-t-[2rem] flex justify-between items-center shadow-md z-10">
                                    <h2 className="text-xl md:text-2xl font-black flex items-center gap-2"><Icons.Package /> 庫存管理</h2>
                                    <button onClick={()=>setShowInventoryPanel(false)}><Icons.Close /></button>
                                </div>
                                <div className="p-4 md:p-6 overflow-y-auto flex-1 bg-slate-50 space-y-3 custom-scrollbar">
                                    {inventory.map(p => (
                                        <div key={p.id} className="flex items-center justify-between bg-white p-3 md:p-4 rounded-2xl border-2 border-slate-200">
                                            <div className="font-black text-base md:text-lg">{p.name}</div>
                                            <div className="flex items-center bg-slate-100 rounded-xl p-1 md:p-1.5 border-2">
                                                <button onClick={() => setInventory(inventory.map(x=>x.id===p.id?{...x,stock:x.stock-1}:x))} className="px-3 py-1 bg-white rounded-lg shadow-sm font-bold text-slate-600">-</button>
                                                <input type="number" value={p.stock} onChange={e => setInventory(inventory.map(x=>x.id===p.id?{...x,stock:parseInt(e.target.value)||0}:x))} className="w-16 md:w-20 text-center text-lg font-black bg-transparent outline-none" />
                                                <button onClick={() => setInventory(inventory.map(x=>x.id===p.id?{...x,stock:x.stock+1}:x))} className="px-3 py-1 bg-white rounded-lg shadow-sm font-bold text-slate-600">+</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-3 md:p-4 bg-white border-t-4 border-slate-100 rounded-b-[2rem]">
                                    <button onClick={handleFinishInventory} className="w-full bg-slate-800 text-white py-3 md:py-4 rounded-xl font-black text-lg">更新至雲端</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {confirmAction && (
                        <div className="modal-overlay" onClick={()=>setConfirmAction(null)}>
                            <div className="bg-white p-6 md:p-8 rounded-3xl max-w-[90%] md:max-w-sm w-full shadow-2xl flex flex-col items-center text-center" onClick={e=>e.stopPropagation()}>
                                <div className="[&>svg]:w-12 [&>svg]:h-12 text-amber-500 mb-4 bg-amber-50 p-4 rounded-full"><Icons.Alert /></div>
                                <h3 className="text-2xl md:text-3xl font-black mb-2">{confirmAction.type === 'reset' ? '確定要清空嗎？' : confirmAction.type === 'next' ? '確定開下一單？' : '確定刪除？'}</h3>
                                <div className="flex gap-3 w-full mt-6">
                                    <button onClick={()=>setConfirmAction(null)} className="flex-1 py-3 md:py-4 rounded-xl font-bold text-lg bg-slate-100 text-slate-600">取消</button>
                                    <button onClick={handleConfirmAction} className="flex-1 py-3 md:py-4 rounded-xl font-black text-lg bg-rose-600 text-white">確定</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showHistory && (
                        <div className="fixed inset-0 z-50 flex justify-end">
                            <div className="absolute inset-0 bg-black/50" onClick={()=>setShowHistory(false)}></div>
                            <div className="relative bg-white w-80 max-w-[85%] h-full shadow-2xl flex flex-col drawer-transition animate-in slide-in-from-right duration-300">
                                <div className="p-4 bg-sky-800 text-white font-black text-lg flex justify-between items-center">
                                    <span>📜 {isLocalMode ? '單機' : '表單'}歷史訂單</span>
                                    <button onClick={()=>setShowHistory(false)}><Icons.Close /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-2">
                                    {history.length === 0 && <p className="p-4 text-gray-400 text-center text-sm">尚無紀錄</p>}
                                    {history.map(record => (
                                        <div key={record.dbId} className={`p-3 md:p-4 border-b border-gray-100 flex items-center justify-between ${currentOrderId === record.dbId ? 'bg-sky-50' : 'bg-white'}`}>
                                            <div className="flex-1 cursor-pointer overflow-hidden" onClick={()=>loadFromHistory(record)}>
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="font-black text-base md:text-lg text-slate-800 truncate pr-2">{record.orderer.isHandwritten ? '(手寫單)' : (record.orderer.name || '未命名')}</span>
                                                    <span className="text-xs text-gray-400">{record.timestampStr.split(' ')[0]}</span>
                                                </div>
                                                <div className="text-sm text-gray-500">
                                                    總額: <span className="text-red-600 font-bold">${record.grandTotal || 0}</span>
                                                    {record.paymentStatus === 'paid' && <span className="ml-1 text-[10px] bg-emerald-100 text-emerald-700 px-1 rounded">已付</span>}
                                                </div>
                                            </div>
                                            <button onClick={(e) => { e.stopPropagation(); setConfirmAction({ type: 'deleteHistory', id: record.dbId }); }} className="ml-2 p-2 text-gray-300 hover:text-red-500"><Icons.Trash /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {screenshotUrl && (
                        <div className="modal-overlay" onClick={()=>setScreenshotUrl(null)}>
                            <div className="bg-white p-4 md:p-6 rounded-3xl max-w-full max-h-screen overflow-auto relative flex flex-col items-center" onClick={e=>e.stopPropagation()}>
                                <p className="text-lg md:text-2xl font-black text-rose-600 mb-3 md:mb-4 animate-bounce">長按圖片儲存 / 分享</p>
                                <img src={screenshotUrl} alt="預覽圖" className="w-full h-auto max-w-[85vw] rounded-xl border-4 border-slate-200 shadow-2xl" />
                                <button onClick={()=>setScreenshotUrl(null)} className="mt-4 md:mt-6 bg-slate-900 text-white px-8 py-3 rounded-full font-bold flex items-center gap-2"><Icons.Close /> 關閉</button>
                            </div>
                        </div>
                    )}

                    {}
                    <div id="thermal-receipt">
                        <div className="thermal-header">
                            <div className="thermal-title">葳葳海鮮</div>
                            <div className="thermal-meta">日期: {new Date().toLocaleString('zh-TW')}</div>
                        </div>
                        <div className="thermal-info">
                            <div style={{flex: 1}}>
                                <div className="thermal-customer">{orderer.isHandwritten ? '姓名：________________' : orderer.name}</div>
                                {orderer.phone && <div className="thermal-phone">{orderer.phone}</div>}
                                {orderer.address && <div className="thermal-address">{orderer.address}</div>}
                            </div>
                            <div style={{textAlign: 'right', paddingLeft: '20px'}}>
                                {paymentStatus === 'paid' && <div className="thermal-status">已付款</div>}
                                {paymentStatus === 'credit' && <div className="thermal-status">餘${creditAmount}</div>}
                            </div>
                        </div>
                        <table className="thermal-table">
                            <thead>
                                <tr>
                                    <th style={{width: '50%'}}>品項</th>
                                    <th style={{width: '20%', textAlign:'center'}}>單價</th>
                                    <th style={{width: '10%', textAlign:'center'}}>量</th>
                                    <th style={{width: '20%', textAlign:'right'}}>小計</th>
                                </tr>
                            </thead>
                            <tbody>
                                {summary.items.map((i, idx) => {
                                    const isSameAsPrev = idx > 0 && i.baseId && summary.items[idx - 1].baseId === i.baseId && (i.type === '一般' || i.type === '另價') && (summary.items[idx - 1].type === '一般' || summary.items[idx - 1].type === '另價');
                                    return (
                                        <tr key={i.uid || idx}>
                                            <td style={{fontWeight: 400, fontSize: '48px', color: !isSameAsPrev ? '#000' : 'transparent'}}>
                                                {!isSameAsPrev ? (
                                                    <>{i.name}{(i.type === '一般' || i.type === '另價') && jinPrices[i.baseId || i.id] !== undefined && <span style={{fontSize:'36px', marginLeft:'10px'}}>(${jinPrices[i.baseId || i.id]}/斤)</span>}{i.type === '分享' && <span style={{fontSize:'32px', marginLeft:'10px', border:'2px solid black', padding:'2px 8px', borderRadius:'8px', fontWeight:'900'}}>分享</span>}{i.type === '限定' && <span style={{fontSize:'32px', marginLeft:'10px', border:'2px solid black', padding:'2px 8px', borderRadius:'8px', fontWeight:'900'}}>限定</span>}</>
                                                ) : null}
                                            </td>
                                            <td style={{textAlign:'center', fontWeight: 400, fontSize: '48px'}}>{i.price}</td>
                                            <td style={{textAlign:'center', fontWeight: 400, fontSize: '48px'}}>{i.qty}</td>
                                            <td style={{textAlign:'right', fontWeight: 400, fontSize: '48px'}}>{i.total}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                        <div className="thermal-footer">
                            <div className="thermal-total-row">
                                <span className="thermal-total-label">總額</span>
                                <span className="thermal-total-amount" style={{fontSize: '90px'}}>${summary.grandTotal}</span>
                            </div>
                        </div>

                                                    </tr>
                                                    <tr className="border-b-4 border-slate-300 text-black">
                                                        <td colSpan="3" className="text-right py-2 pr-4 font-bold flex items-center justify-end gap-2">折讓金額<input type="number" placeholder="0" value={discount} onChange={e=>setDiscount(e.target.value)} className="w-20 p-1 border rounded text-center bg-slate-50" /></td>
                                                        <td className="text-left pl-6 font-black text-emerald-600">-{summary.actualDisc}</td>
                                                    </tr>
                                                    <tr className="text-black bg-slate-100">
                                                        <td colSpan="3" className="text-right py-6 pr-4 font-black text-2xl md:text-4xl uppercase tracking-widest">總額</td><td className="text-left pl-6 py-6 font-black text-3xl md:text-5xl text-sky-700">${summary.grandTotal}</td>
                                                    </tr>
                                                </tfoot>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {}
                    <div className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 p-3 md:p-4 shadow-2xl z-40 no-print flex justify-center pb-8 md:pb-4">
                        <div className="w-full max-w-4xl flex gap-2 md:gap-4">
                            {!showBill ? (
                                <>
                                    <div className="flex-[0.5] md:flex-[0.4] bg-slate-800 rounded-xl p-2 md:p-3 flex flex-col justify-center border border-slate-700">
                                        <p className="text-slate-400 text-[10px] md:text-xs font-bold uppercase tracking-widest text-center mb-0.5">總額</p>
                                        <p className="text-white text-lg md:text-2xl font-black text-center leading-none">${summary.grandTotal}</p>
                                    </div>
                                    <button onClick={submitOrder} className="flex-1 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-black text-lg md:text-2xl shadow-lg flex items-center justify-center gap-2 transition-colors"><Icons.Check /> 產出明細</button>
                                </>
                            ) : (
                                <>
                                    <button onClick={()=>setShowBill(false)} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-black text-sm md:text-lg py-3 flex items-center justify-center gap-1"><Icons.ChevronLeft /> 返回修改</button>
                                    <button onClick={handleScreenshot} id="btn-screenshot" className="flex-[1.5] bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-black text-sm md:text-xl py-3 flex items-center justify-center gap-1 shadow-lg"><Icons.Camera /> 分享訂單</button>
                                    <button onClick={handleThermalPrint} id="btn-thermal" className="flex-[1.5] bg-amber-600 hover:bg-amber-500 text-white rounded-xl font-black text-sm md:text-xl py-3 flex items-center justify-center gap-1 shadow-lg"><Icons.Printer /> 出貨貼紙</button>
                                    <button onClick={()=>setConfirmAction({type: 'next'})} className="flex-1 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-black text-sm md:text-lg py-3 flex items-center justify-center gap-1 shadow-lg"><Icons.Plus /> 下一單</button>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><MainApp /></ErrorBoundary>);
    </script>
</body>
</html>
